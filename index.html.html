<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean TV</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #181818;
  padding: 15px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  position: sticky;
  top: 0;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  background: red;
  padding: 6px;
  border-radius: 7px;
}

.search {
  display: flex;
  flex: 1;
  max-width: 550px;
}

.search input {
  width: 100%;
  padding: 12px;
  background: #090909;
  color: white;
  border: 1px solid #444;
  border-radius: 20px 0 0 20px;
}

.search button {
  padding: 10px 20px;
  background: #333;
  color: white;
  border: none;
  cursor: pointer;
}

.upload {
  background: red;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 20px;
  cursor: pointer;
}

main {
  padding: 25px 5%;
}

h1 {
  font-size: 26px;
}

.categories {
  display: flex;
  gap: 10px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.categories button {
  background: #333;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
}

.categories button.active {
  background: white;
  color: black;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 22px;
}

.video-card {
  cursor: pointer;
}

.thumbnail {
  width: 100%;
  height: 160px;
  background: #292929;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 45px;
  overflow: hidden;
}

.thumbnail video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-card h3 {
  font-size: 16px;
  margin-bottom: 5px;
}

.meta {
  color: #aaa;
  font-size: 13px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 10;
}

.modal.show {
  display: flex;
}

.dialog {
  background: #202020;
  padding: 25px;
  border-radius: 15px;
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  overflow-y: auto;
}

.dialog input,
.dialog textarea,
.dialog select {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  background: #111;
  border: 1px solid #555;
  color: white;
  border-radius: 7px;
}

.dialog textarea {
  min-height: 75px;
}

.dialog button {
  padding: 11px 17px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  margin: 5px;
}

.primary {
  background: red;
  color: white;
}

.secondary {
  background: #444;
  color: white;
}

#player {
  width: 100%;
  max-height: 400px;
  background: black;
}

#commentsList {
  margin-top: 15px;
}

.comment {
  border-top: 1px solid #444;
  padding: 12px 0;
}

@media(max-width:600px) {
  header {
    padding: 12px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 19px;
  }

  .search {
    order: 3;
    flex-basis: 100%;
  }

  .video-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .thumbnail {
    height: 110px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo"><span>▶</span> Korean TV</div>

  <div class="search">
    <input id="searchInput" placeholder="Search videos...">
    <button onclick="searchVideos()">⌕</button>
  </div>

  <button class="upload" onclick="openUpload()">
    + Upload
  </button>
</header>

<main>
  <h1>Welcome to Chandra TV</h1>
  <p>Watch videos, share your creativity!</p>

  <div class="categories">
    <button class="active" onclick="filterVideos('all',this)">All</button>
    <button onclick="filterVideos('gaming',this)">Gaming</button>
    <button onclick="filterVideos('entertainment',this)">Entertainment</button>
    <button onclick="filterVideos('education',this)">Education</button>
    <button onclick="filterVideos('animals',this)">Animals</button>
  </div>

  <div class="video-grid" id="videoGrid">
  </div>
</main>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
  <div class="dialog">
    <h2>Upload Video</h2>

    <form id="uploadForm">
      <input id="videoTitle"
        placeholder="Video title" required>

      <select id="videoCategory">
        <option value="gaming">Gaming</option>
        <option value="entertainment">Entertainment</option>
        <option value="education">Education</option>
        <option value="animals">Animals</option>
      </select>

      <input type="file" id="videoFile"
        accept="video/*" required>

      <textarea id="videoDescription"
        placeholder="Video description"></textarea>

      <button class="primary" type="submit">
        Publish Video
      </button>

      <button type="button" class="secondary"
        onclick="closeUpload()">
        Cancel
      </button>
    </form>
  </div>
</div>

<!-- Watch Modal -->
<div class="modal" id="watchModal">
  <div class="dialog">
    <button class="secondary"
      onclick="closeWatch()">Close ✕</button>

    <video id="player" controls></video>

    <h2 id="watchTitle"></h2>
    <p id="watchDescription"></p>

    <button class="primary" onclick="likeVideo()">
      ♥ Like
    </button>

    <span id="likeCount"></span>

    <h3>Comments</h3>

    <form id="commentForm">
      <input id="commentInput"
        placeholder="Write a comment..." required>
      <button class="primary">Post</button>
    </form>

    <div id="commentsList"></div>
  </div>
</div>

<script>
let videos = [];
let currentVideo = null;
let currentFilter = "all";

const grid = document.getElementById("videoGrid");

function openUpload() {
  document.getElementById("uploadModal")
    .classList.add("show");
}

function closeUpload() {
  document.getElementById("uploadModal")
    .classList.remove("show");
}

function closeWatch() {
  const player = document.getElementById("player");
  player.pause();
  player.removeAttribute("src");
  player.load();

  document.getElementById("watchModal")
    .classList.remove("show");
}

document.getElementById("uploadForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  const file = document.getElementById("videoFile")
    .files[0];

  if (!file) return;

  const video = {
    id: Date.now(),
    title: document.getElementById("videoTitle").value,
    category: document.getElementById("videoCategory").value,
    description: document.getElementById("videoDescription").value,
    url: URL.createObjectURL(file),
    likes: 0,
    liked: false,
    comments: []
  };

  videos.unshift(video);

  this.reset();
  closeUpload();
  renderVideos();
});

function renderVideos() {
  const filtered = videos.filter(video => {
    return currentFilter === "all" ||
      video.category === currentFilter;
  });

  grid.innerHTML = "";

  filtered.forEach(video => {
    const card = document.createElement("div");
    card.className = "video-card";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";

    const preview = document.createElement("video");
    preview.src = video.url;
    preview.muted = true;
    preview.preload = "metadata";

    thumbnail.appendChild(preview);

    const title = document.createElement("h3");
    title.textContent = video.title;

    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent =
      "Chandra TV · " + video.likes + " likes";

    card.append(thumbnail, title, meta);

    card.onclick = () => watchVideo(video.id);

    grid.appendChild(card);
  });

  if (!filtered.length) {
    grid.textContent = "No videos uploaded yet. Click Upload!";
  }
}

function watchVideo(id) {
  currentVideo = videos.find(v => v.id === id);

  if (!currentVideo) return;

  document.getElementById("player").src =
    currentVideo.url;

  document.getElementById("watchTitle").textContent =
    currentVideo.title;

  document.getElementById("watchDescription").textContent =
    currentVideo.description;

  updateWatch();

  document.getElementById("watchModal")
    .classList.add("show");
}

function updateWatch() {
  if (!currentVideo) return;

  document.getElementById("likeCount").textContent =
    currentVideo.likes + " likes";

  document.querySelector("#watchModal .primary")
    .textContent = currentVideo.liked ? "♥ Liked" : "♥ Like";

  const list = document.getElementById("commentsList");
  list.innerHTML = "";

  currentVideo.comments.forEach(comment => {
    const item = document.createElement("div");
    item.className = "comment";
    item.textContent = comment;
    list.appendChild(item);
  });
}

function likeVideo() {
  if (!currentVideo) return;

  currentVideo.liked = !currentVideo.liked;
  currentVideo.likes += currentVideo.liked ? 1 : -1;

  updateWatch();
  renderVideos();
}

document.getElementById("commentForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  if (!currentVideo) return;

  const input = document.getElementById("commentInput");
  const comment = input.value.trim();

  if (!comment) return;

  currentVideo.comments.push(comment);
  input.value = "";

  updateWatch();
});

function filterVideos(category, button) {
  currentFilter = category;

  document.querySelectorAll(".categories button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderVideos();
}

function searchVideos() {
  const query = document.getElementById("searchInput")
    .value.toLowerCase().trim();

  document.querySelectorAll(".video-card").forEach(card => {
    const title = card.querySelector("h3")
      .textContent.toLowerCase();

    card.style.display =
      title.includes(query) ? "" : "none";
  });
}

renderVideos();
</script>

</body>
</html>
